services:
  - type: web
    name: p2p-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: P2P_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: p2p-reservations
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run reservations:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: P2P_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: p2p-retention
    runtime: node
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run data:prune
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: P2P_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
